name: Publish VS Code extension

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-vscode
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx --no-install vsce package --out agentica-lsp.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: agentica-lsp-vsix
          path: editors/vscode/agentica-lsp.vsix
      - run: npx --no-install vsce publish --oidc --packagePath agentica-lsp.vsix
