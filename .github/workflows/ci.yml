name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  AGENTICA_VERSION: "0.30.1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Agentica
        uses: agentica-lang/setup-agentica@v1
        with:
          version: ${{ env.AGENTICA_VERSION }}
          sha256: bfd2932a00345f1459dea974c56b9f87ad0078d722466ce485dc56dcfb45643b # linux-x86_64

      - run: agentica --version

      - run: make test

      - run: node --check editors/vscode/extension.js

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Agentica
        uses: agentica-lang/setup-agentica@v1
        with:
          version: ${{ env.AGENTICA_VERSION }}
          sha256: dc8a8f4e23d0890b67b00c9aa7ee656372cf350702905aa2c850b3dc04be5161 # windows-x86_64

      - run: agentica --version

      - run: agentica check src/main.agc bin/prepare.agc specs/smoke.agc specs/steps.agc

      - name: Start the server through bin\agc-lsp.bat
        shell: cmd
        run: |
          agentica specs\smoke.agc input %RUNNER_TEMP%\smoke-in.txt || exit /b 1
          set "AGC_LSP_CACHE=%RUNNER_TEMP%\agc-lsp-smoke-cache"
          call bin\agc-lsp.bat --stdio < %RUNNER_TEMP%\smoke-in.txt > %RUNNER_TEMP%\smoke-out.txt || exit /b 1
          agentica specs\smoke.agc verify %RUNNER_TEMP%\smoke-out.txt || exit /b 1

      - name: Run the specs that are not for Unix only
        shell: bash
        run: agentica test specs/*.feature --steps specs/steps.agc
