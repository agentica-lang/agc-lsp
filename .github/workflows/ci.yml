name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  AGENTICA_VERSION: "0.5.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Agentica
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="agentica-${AGENTICA_VERSION}-linux-x86_64"
          cd "$RUNNER_TEMP"
          gh release download "$AGENTICA_VERSION" -R sonic182/agentica -p "${archive}.tar.gz" -p SHA256SUMS
          sha256sum -c --ignore-missing SHA256SUMS
          tar xzf "${archive}.tar.gz"
          echo "$RUNNER_TEMP/${archive}/bin" >> "$GITHUB_PATH"

      - run: agentica --version

      - run: make test
