name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  AGENTICA_VERSION: "0.33.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Agentica
        uses: agentica-lang/setup-agentica@v1
        with:
          version: ${{ env.AGENTICA_VERSION }}
          sha256: 9d02759b0903ddae9db624e3cb431ede7fe5d836acea0d4ff005f60e7116b350 # linux-x86_64

      - run: agentica --version

      - run: make test

      - run: node --check editors/vscode/extension.js

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Agentica
        uses: agentica-lang/setup-agentica@v1
        with:
          version: ${{ env.AGENTICA_VERSION }}
          sha256: 3b11bdc33a5fe88daca5b8041a936dcc405bae74328172d209ff12a55367d6be # windows-x86_64

      - run: agentica --version

      - run: agentica check src/main.agc bin/prepare.agc specs/smoke.agc specs/steps.agc

      - name: Start the server through bin\agc-lsp.bat
        shell: cmd
        run: |
          agentica specs\smoke.agc input %RUNNER_TEMP%\smoke-in.txt || exit /b 1
          set "AGC_LSP_CACHE=%RUNNER_TEMP%\agc-lsp-smoke-cache"
          call bin\agc-lsp.bat --stdio < %RUNNER_TEMP%\smoke-in.txt > %RUNNER_TEMP%\smoke-out.txt || exit /b 1
          agentica specs\smoke.agc verify %RUNNER_TEMP%\smoke-out.txt || exit /b 1

      - name: Run the specs that are not for Unix only
        shell: bash
        run: agentica test specs/*.feature --steps specs/steps.agc

  vscode:
    name: VSIX smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sha256: 9d02759b0903ddae9db624e3cb431ede7fe5d836acea0d4ff005f60e7116b350
          - os: macos-15
            sha256: d79e155689473dcf069d7571c7bfef3da97e7295ed7269eb38a9afc59f3b2950
          - os: windows-latest
            sha256: 3b11bdc33a5fe88daca5b8041a936dcc405bae74328172d209ff12a55367d6be
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: agentica-lang/setup-agentica@v1
        with:
          version: ${{ env.AGENTICA_VERSION }}
          sha256: ${{ matrix.sha256 }}
      - run: npm ci
      - run: npx --no-install vsce package --out agentica-lsp.vsix
      - if: runner.os == 'Linux'
        run: xvfb-run -a node test/vsix.js agentica-lsp.vsix "$(command -v agentica)"
      - if: runner.os != 'Linux'
        shell: pwsh
        run: node test/vsix.js agentica-lsp.vsix (Get-Command agentica).Source
