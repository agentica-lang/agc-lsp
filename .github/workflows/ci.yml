name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  AGENTICA_VERSION: "0.18.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Agentica
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="agentica-${AGENTICA_VERSION}-linux-x86_64"
          cd "$RUNNER_TEMP"
          gh release download "$AGENTICA_VERSION" -R agentica-lang/agentica -p "${archive}.tar.gz" -p SHA256SUMS
          sha256sum -c --ignore-missing SHA256SUMS
          tar xzf "${archive}.tar.gz"
          echo "$RUNNER_TEMP/${archive}/bin" >> "$GITHUB_PATH"

      - run: agentica --version

      - run: make test

      - run: node --check editors/vscode/extension.js

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Agentica
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="agentica-${AGENTICA_VERSION}-windows-x86_64"
          cd "$RUNNER_TEMP"
          gh release download "$AGENTICA_VERSION" -R agentica-lang/agentica -p "${archive}.zip" -p SHA256SUMS
          sha256sum -c --ignore-missing SHA256SUMS
          unzip -q "${archive}.zip"
          echo "$(cygpath -w "$RUNNER_TEMP/${archive}/bin")" >> "$GITHUB_PATH"

      - run: agentica --version

      - run: agentica check src/main.agc bin/prepare.agc specs/smoke.agc specs/steps.agc

      - name: Start the server through bin\agc-lsp.bat
        shell: cmd
        run: |
          agentica specs\smoke.agc input %RUNNER_TEMP%\smoke-in.txt || exit /b 1
          set "AGC_LSP_CACHE=%RUNNER_TEMP%\agc-lsp-smoke-cache"
          call bin\agc-lsp.bat --stdio < %RUNNER_TEMP%\smoke-in.txt > %RUNNER_TEMP%\smoke-out.txt || exit /b 1
          agentica specs\smoke.agc verify %RUNNER_TEMP%\smoke-out.txt || exit /b 1

      - name: Run the specs that are not for Unix only
        shell: bash
        run: agentica test specs/*.feature --steps specs/steps.agc
